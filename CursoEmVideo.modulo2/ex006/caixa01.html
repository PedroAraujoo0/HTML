<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h1, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{ /* box-level*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            
            /*Ordem Horária*/
            border: 10px solid darkslategray;

            padding: 10px 10px 10px 10px;

            margin: 10px auto 10px auto;

            outline: 5px dashed blue;
        }
        a{  /* inline level*/
        
            border: 2px dotted red;
        }
    </style>
</head>
<body>
    <h1>Exemplo caixa box-level</h1>
    <p>Paragrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de box inline level</a>Vamos ver como tudo funciona.</p>

</body>
</html>
