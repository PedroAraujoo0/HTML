<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando links</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
            
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:visited{
            color: darkred;
        }
        a:active{
            color: yellow;
        }
        .especial::before{
            content: '⇒';
        }
        .especial::after{
            content: '⇐';
            
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/PedroAraujoo0" class="especial">Respositório do GitHub</a></li>
        <li><a href="https://www.instagram.com/gottesaraujo/">Instagram</a></li>
    </ul>
</body>
</html>
