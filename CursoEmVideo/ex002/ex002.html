<body>
    <h1>Parágrafos e quebras de linha</h1>
    <p>
        Posso escrever de qualquer jeito,<br><br> importante é estar entre o &lt;p&gt; e &lt;/p&gt; ! <br> <!-- LESS THAN / GREATER THAN-->

        <br>Lt e gt fazem os sinais em volta do p,  br e etc... já a tag &lt;br&gt; para quebra de linha em algum lugar especifico!
    </p>
    <p>Adição de simbolos especiais
        &reg;
        &copy;
        &euro;
        &darr;
        &lAarr;
        &Delta;

    </p>
    <p>
        Emojis:
        &#x1F618; <!--Utilizamos o &#x para dizer que o valor é em hexadecimal, e temos que usar antes de usar os emojis-->
        &#x1F525;
    </p>
</body>
