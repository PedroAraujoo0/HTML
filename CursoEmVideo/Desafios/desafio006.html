        <li><abbr title="Utilizamos a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Utilizamos a tag <code>">Códigos-fonte</abbr></li>
        <li><abbr title="Utilizamos a tag <ol>">Listas Númericas</abbr></li>

    </ul>
