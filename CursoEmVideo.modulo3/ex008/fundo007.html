<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamneto vertical</title>
    <style>
        #container{
            height: 95vh;
            position: relative;
            
            padding: 10px;
            background-color: rgb(92, 0, 92);
        }
        #conteudo{
            position: absolute;
            width: 400px;
            height: 200px;
            background-color: yellow;

            left: 50%;  /*So funciona quando a position = absolute*/
            top: 50%;

            transform: translate(-50%, -50%);

        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
